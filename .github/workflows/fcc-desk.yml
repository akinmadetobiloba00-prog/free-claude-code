# SPDX-License-Identifier: AGPL-3.0-only
# Builds FCC Desk installers for Windows, macOS and Linux.
# - Push to fcc-desk (desktop/** changes) or run manually: uploads installers as workflow artifacts.
# - Push a tag desk-v*: also creates a draft GitHub release with the installers attached.
name: FCC Desk

on:
  push:
    branches: [fcc-desk]
    paths: ["desktop/**", ".github/workflows/fcc-desk.yml"]
    tags: ["desk-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell add-on scripts parse
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: .
        run: |
          foreach ($f in "scripts/install-desktop.ps1", "scripts/uninstall-desktop.ps1", "scripts/install.ps1") {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | Format-List | Out-String | Write-Host; throw "Parse errors in $f" }
          }
          ./scripts/install-desktop.ps1 -Help

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      # Icons are generated from the committed SVG so the repo holds no binary art.
      - run: pnpm icons

      - name: Build (artifacts only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Build and draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "FCC Desk ${{ github.ref_name }}"
          releaseBody: "FCC Desk desktop app for Free Claude Code. Not affiliated with Anthropic. Unsigned test build."
          releaseDraft: true
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: fcc-desk-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
